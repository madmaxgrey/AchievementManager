[plugin]
id = "achievement-manager"
name = "Achievement Manager"
version = "1.15.0"
author = "madmaxgrey"
description = "A button next to View My Achievements that opens a window to unlock or lock achievements and edit stats on your Steam account."

[assets]
# the helpers are bundled as resources: on Windows the backend writes out and compiles the C# helper on first use, on Linux it runs the Python helper
resources = ["resources/**/*"]

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"
