[plugin]
id = "achievement-manager"
name = "Achievement Manager"
version = "1.12.1"
author = "madmaxgrey"
description = "An Achievement Manager tab in the library's achievements window: unlock or lock achievements on your Steam account, using Steam's own controls."

[assets]
# the helpers are bundled as resources: on Windows the backend writes out and compiles the C# helper on first use, on Linux it runs the Python helper
resources = ["resources/**/*"]

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"
